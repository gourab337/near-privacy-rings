[package]
name = "near-privacy-rings"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shielded pool (confidential + anonymous rings) for NEAR, verified with Groth16 on alt_bn128"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
mainnet = []

[dependencies]
near-sdk = "5.30.1"
ark-bn254 = { version = "0.6.0", default-features = false, features = ["scalar_field"] }
ark-ff = { version = "0.6.0", default-features = false }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
serde_json = "1"
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
